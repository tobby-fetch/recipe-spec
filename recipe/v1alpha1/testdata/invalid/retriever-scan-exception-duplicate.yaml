apiVersion: recipe.tobby.dev/v1alpha1
kind: Retriever
metadata:
  name: restricted-zone
spec:
  cookbook: registry.example.com/cookbook
  recipes:
    - name: wordpress
      version: "6.8.2"
  scanPolicy:
    exceptions:
