# Tool versions for the recipe-spec Go SDK and website (portable across
# machines / CI via mise). Matches the versions the project is developed and
# built with.
[tools]
go = "1.25.6"
golangci-lint = "2.6.1"
node = "24.18.0"
pnpm = "10.33.2"
gitleaks = "8.30.1"

# One-time per clone: activate the versioned git hooks (secret scanning
# on every commit — see .githooks/pre-commit).
#   mise run setup
[tasks.setup]
description = "Activate the repo git hooks (gitleaks secret scan on commit)"
run = "git config core.hooksPath .githooks && echo 'hooks enabled (.githooks)'"

# Scan the whole git history for leaked secrets.
#   mise run secrets-scan
[tasks.secrets-scan]
description = "Scan the full git history for leaked secrets (gitleaks)"
run = "gitleaks git --redact --no-banner ."

# Run the Go SDK tests (race detector on, twice, as in CI).
#   mise run test
[tasks.test]
description = "Run the Go SDK tests (go test -race -count=2)"
run = "go test -race -count=2 ./..."

# Lint the Go SDK.
#   mise run lint
[tasks.lint]
description = "Lint the Go SDK (golangci-lint)"
run = "golangci-lint run"

# Run the website locally.
#   mise run doc
# Starts the Astro dev server at http://localhost:4321/recipe-spec/
[tasks.doc]
description = "Serve the website locally (Astro dev server)"
dir = "website"
run = "pnpm install --prefer-offline && pnpm dev"

# Build the static site into website/dist/ (same as the Pages workflow).
#   mise run build
[tasks.build]
description = "Build the static website into website/dist/"
dir = "website"
run = "pnpm install --prefer-offline && pnpm build"
